opencollection: 1.0.0
info:
  name: Cadê
  description: Coleção OpenAPI para testar as rotas da aplicação Cadê?
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json
variable:
  - key: baseUrl
    value: http://localhost:3000
item:
  - name: Verificar se a API está funcionando
    request:
      method: GET
      url: "{{baseUrl}}/"
    response: []
  - name: Autenticação
    item:
      - name: Cadastrar usuário
        request:
          method: POST
          url: "{{baseUrl}}/auth/register"
          body:
            mode: raw
            raw: |
              {
                "name": "David",
                "email": "david@example.com",
                "password": "senha123"
              }
            options:
              raw:
                language: json
        response: []
      - name: Login
        request:
          method: POST
          url: "{{baseUrl}}/auth/login"
          body:
            mode: raw
            raw: |
              {
                "email": "david@example.com",
                "password": "senha123"
              }
            options:
              raw:
                language: json
        response: []
  - name: Itens
    item:
      - name: Listar todos os itens
        request:
          method: GET
          url: "{{baseUrl}}/items"
        response: []
      - name: Buscar item por ID
        request:
          method: GET
          url: "{{baseUrl}}/items/{{itemId}}"
        response: []
      - name: Criar um item
        request:
          method: POST
          url: "{{baseUrl}}/items"
          auth:
            type: bearer
            bearer:
              - key: token
                value: "{{token}}"
                type: string
          body:
            mode: formdata
            formdata:
              - key: name
                value: Mochila preta
                type: text
              - key: description
                value: Mochila encontrada perto da biblioteca
                type: text
              - key: location
                value: Biblioteca
                type: text
              - key: date
                value: "2026-09-20"
                type: text
              - key: image
                type: file
                src: ""
        response: []
      - name: Atualizar um item
        request:
          method: PATCH
          url: "{{baseUrl}}/items/{{itemId}}"
          auth:
            type: bearer
            bearer:
              - key: token
                value: "{{token}}"
                type: string
          body:
            mode: formdata
            formdata:
              - key: name
                value: Mochila preta atualizada
                type: text
              - key: image
                type: file
                src: ""
        response: []
      - name: Excluir item por ID
        request:
          method: DELETE
          url: "{{baseUrl}}/items/{{itemId}}"
          auth:
            type: bearer
            bearer:
              - key: token
                value: "{{token}}"
                type: string
        response: []
      - name: Gerar relatório em PDF
        request:
          method: GET
          url: "{{baseUrl}}/items/report"
        response: []
      - name: Exportar itens em CSV
        request:
          method: GET
          url: "{{baseUrl}}/items/export?from=2026-09-01&to=2026-09-30&delimiter=,"
        response: []
  - name: Logs
    item:
      - name: Consultar logs por data
        request:
          method: GET
          url: "{{baseUrl}}/logs/{{date}}"
          header:
            - key: x-timezone
              value: America/Fortaleza
          auth:
            type: bearer
            bearer:
              - key: token
                value: "{{token}}"
                type: string
        response: []
